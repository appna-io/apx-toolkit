name: Publish @apx-ui/toolkit to npm

on:
  push:
    branches: [main]
  # By hand: the first run, once npm trusts this workflow, and a re-run after a failed publish.
  workflow_dispatch:

# Don't re-run on the version-bump commit this workflow pushes back to main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commit the version bump + push git tags
  id-token: write # npm trusted publishing (OIDC): no publish token anywhere

jobs:
  publish:
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip publish]')
    runs-on: ubuntu-latest
    # The checks below are the pre-push hook's; husky would run them again on the bump's push.
    env:
      HUSKY: 0
    steps:
      # main's tip, not the pushed commit: runs queue one at a time, so this one starts from the last run's bump.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Every dependency is public, so no read token. No lockfile is committed.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The library is the workspace in package/; the root is the private playground.
      - name: Bump patch version
        run: npm version patch --no-git-tag-version -w @apx-ui/toolkit

      - name: Read new version
        id: version
        run: echo "version=$(node -p "require('./package/package.json').version")" >> "$GITHUB_OUTPUT"

      # Packed before the push: what is published is what was built and tested, whatever the rebase below brings in.
      - name: Pack
        run: npm pack -w @apx-ui/toolkit --pack-destination "$RUNNER_TEMP"

      # main may have moved since checkout: rebase the bump onto it and push again. package-lock.json is git-ignored.
      - name: Commit version bump
        run: |
          git add package/package.json
          git commit -m "chore: release @apx-ui/toolkit v${{ steps.version.outputs.version }} [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      # No token: npm exchanges the job's OIDC token, for the trusted publisher set on npmjs.com (appna-io/apx-toolkit,
      # publish.yml).
      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP/apx-ui-toolkit-${{ steps.version.outputs.version }}.tgz"

      - name: Create Git tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
